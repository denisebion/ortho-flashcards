<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="Study the OITE questions I've missed, with spaced repetition.">
  <!-- installable web app (PWA); iOS: Share > Add to Home Screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ortho Cards">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Ortho Flashcards</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <p id="storage-warning" class="warning" role="alert" hidden></p>

  <!-- Home: pick topics, start -->
  <main id="home" class="view" hidden>
    <header class="home-head">
      <h1>Ortho Flashcards</h1>
      <p class="muted" id="total"></p>
    </header>
    <h2 class="section-label">Topics</h2>
    <div id="chips" class="chips"></div>

    <h2 class="section-label">Options</h2>
    <div class="options">
      <label class="toggle"><input type="checkbox" id="shuffle" checked> Shuffle</label>
      <label class="toggle">New cards per session
        <select id="new-limit">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="0">All</option>
        </select>
      </label>
    </div>

    <details class="tools">
      <summary>Backup &amp; reset</summary>
      <p class="muted">Progress is saved in this browser only. Export a file to back it up or move it to another device; importing merges (the most recent review of each card wins).</p>
      <div class="tool-buttons">
        <button id="export" class="secondary" type="button">Export progress</button>
        <button id="import" class="secondary" type="button">Import progress</button>
        <button id="reset" class="secondary danger" type="button">Reset progress</button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <p id="tools-msg" class="muted" role="status"></p>
    </details>

    <div class="home-foot">
      <div>
        <p id="due" class="due"></p>
        <p id="due-detail" class="muted small"></p>
      </div>
      <button id="start" class="primary" type="button">Start</button>
    </div>
  </main>

  <!-- Study: one card at a time -->
  <main id="study" class="view study" hidden>
    <header class="study-head">
      <button id="exit" class="icon-btn" type="button" aria-label="End session (progress is saved)">✕</button>
      <span class="keys-hint">Space flip · 1–4 rate · Esc exit</span>
      <span id="progress-text" class="progress-text"></span>
    </header>
    <div class="progress"><div id="progress-bar"></div></div>
    <div id="card-area" class="card-area"></div>
    <div id="actions" class="actions"></div>
  </main>

  <!-- End of session -->
  <main id="done" class="view" hidden>
    <h1>Session complete</h1>
    <div id="done-stats" class="stats"></div>
    <p id="done-breakdown" class="breakdown" aria-label="First-try ratings"></p>
    <p id="done-next" class="muted"></p>
    <section id="again-section">
      <h2 class="section-label">Hit "Again" on</h2>
      <ul id="again-list" class="again-list"></ul>
      <button id="study-again" class="secondary" type="button">Study these again</button>
    </section>
    <button id="home-btn" class="primary" type="button">Back to home</button>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
